name: 不具合報告
description: 表示崩れ・リンク切れ・公開不具合を記録します
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 何が起きているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する状態
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 対象ページ
      placeholder: index.html / 公開URL など
  - type: textarea
    id: notes
    attributes:
      label: 補足
