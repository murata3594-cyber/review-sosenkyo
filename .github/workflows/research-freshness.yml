name: Research freshness watch

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check research freshness
        id: freshness
        shell: bash
        run: |
          if python scripts/check_research_freshness.py --days 30 --report research-freshness-report.md; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update refresh issue
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="[AUTO] Research data refresh required"
          ISSUE=$(gh issue list --state open --search '"[AUTO] Research data refresh required" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file research-freshness-report.md
          else
            gh issue create --title "$TITLE" --body-file research-freshness-report.md
          fi
