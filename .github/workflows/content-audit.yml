name: Content evidence audit

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "article*.html"
      - "scripts/audit_content.py"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit manifest, queue and evidence ledgers
        run: python scripts/audit_content.py
