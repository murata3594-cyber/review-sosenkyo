name: Validate production pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate the autonomous runtime contract
        shell: bash
        run: |
          set -e
          python scripts/acr_runtime.py adapter-validate
          python scripts/acr_runtime.py state-validate
          python scripts/acr_runtime.py gate
      - name: Autopilot planner must stay executable
        shell: bash
        run: |
          set +e
          python scripts/autopilot_cycle.py plan --ci --out /tmp/work_order.json >/dev/null
          code=$?
          # 0 = a work order was produced, 3 = nothing to do. Anything else is a defect.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            echo "autopilot planner failed with exit $code"
            python scripts/autopilot_cycle.py plan --ci --out /tmp/work_order.json
            exit 1
          fi
          if [ "$code" = "0" ]; then
            python scripts/autopilot_cycle.py prompt --work-order /tmp/work_order.json >/dev/null
          fi
      - name: Build and audit production output
        run: python scripts/build_dist.py
