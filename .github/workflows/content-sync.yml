name: Sync published content

on:
  push:
    branches: ["main"]
    paths:
      - "data/content_manifest.json"
      - "scripts/sync_content.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "content-sync"
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate homepage, rankings, category, sitemap and robots
        run: python scripts/sync_content.py

      - name: Commit generated files when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html rankings.html category.html sitemap.xml robots.txt; then
            echo "Generated content already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rankings.html category.html sitemap.xml robots.txt
          git commit -m "chore: sync published content"
          git push origin main
