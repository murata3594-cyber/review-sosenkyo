<section class="section"><div class="wrap" style="max-width:850px"><div class="sec-kicker">METHODOLOGY</div><h1 style="font-size:44px;color:#132C45">レビュー総選挙の調査方法</h1>
<div class="sectionbox"><h2>1. 比較対象を揃える</h2><p>同じ用途の商品を比較し、条件が大きく違うものは別グループに分けます。</p></div>
<div class="sectionbox"><h2>2. 公式仕様とレビューを分ける</h2><p>仕様はメーカー情報を基準にし、レビューは使用感の傾向として扱います。</p></div>
<div class="sectionbox"><h2>3. 良い・悪い・割れるを分類</h2><p>高評価だけでなく、不満・評価が割れた理由を別枠で整理します。</p></div>
<div class="sectionbox"><h2>4. 使用感として再構成</h2><p>個別レビューの大量転載ではなく、複数の声に共通する傾向を分析文としてまとめます。</p></div>
